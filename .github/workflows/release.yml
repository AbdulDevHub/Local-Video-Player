name: Release extension

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build extension zip
        run: zip -r local-video-player-extension.zip manifest.json index.html scripts styles fonts icons LICENSE
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" local-video-player-extension.zip --clobber \
            || gh release create "$GITHUB_REF_NAME" local-video-player-extension.zip --title "Local Video Player $GITHUB_REF_NAME" --generate-notes
